<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>MediSens | Initial Consultation</title>
    <link rel="stylesheet" href="../src/styles/tokens.css">
    <link rel="stylesheet" href="../src/styles/dashboard.css">
    <style>
    body {
        font-family: var(--font-sans);
        background-color: var(--bg);
        margin: 0;
        display: flex; /* Sidebar and Main side-by-side */
    }

    /* ── Layout Structure ── */
    #root { width: 100%; display: flex; }

    .main-content {
        flex: 1;
        padding: clamp(12px, 1.5vw, 24px);
        width: 100%;
        max-width: none;
        min-width: 0;
        margin: 0;
    }

    /* ── Responsive Form Grid ── */
    .form-section {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 24px;
        margin-bottom: 24px;
        box-shadow: 0 1px 3px var(--shadow-neutral-xs);
    }

    .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr));
        gap: 14px;
        margin-top: 16px;
    }

    .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    /* ── Re-use dashboard radio styles ── */
    .radio-group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
    }

    .radio-opt {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 9px 16px; border: 1.5px solid var(--border);
        border-radius: 8px; cursor: pointer;
        font-size: 0.85rem; font-weight: 500; color: var(--text-2);
        background: var(--white); transition: all 0.15s; user-select: none;
    }

    .radio-opt:hover { border-color: var(--brand-primary); }

    .radio-opt.sel,
    .radio-opt:has(input:checked) {
        border-color: var(--brand-primary); background: var(--brand-soft-surface);
        color: var(--brand-active); font-weight: 600;
    }

    /* ── Inputs ── */
    label {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--text);
    }

    input[type="text"], input[type="number"], input[type="date"],
    input[type="time"], textarea, select {
        padding: 10px 14px;
        border: 1.5px solid var(--border);
        border-radius: 8px;
        font-size: 0.9rem;
        outline: none;
        transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
        border-color: var(--brand-primary);
        box-shadow: 0 0 0 3px var(--ring-brand-legacy);
    }

    /* ── Laptop specific adjustment ── */
    @media (min-width: 1024px) {
        .form-grid.three-cols {
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }
    }
</style>
</head>
<body>
    <div id="root"></div>
    <script type="module" src="../src/app/lab-request/index.tsx"></script>
</body>
</html>
