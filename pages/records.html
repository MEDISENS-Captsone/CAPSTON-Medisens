<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Patient Records | MediSens</title>
    <link rel="stylesheet" href="../src/styles/tokens.css">

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* CSS Reset & Body Setup */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* The Responsive Container */
        .page-container {
            width: 100%;
            max-width: none;
            min-width: 0;
        }

        /* Card Styles */
        .list-card { background: var(--white); border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 1px 2px var(--shadow-brand-legacy); overflow: hidden; }
        .list-header { display: flex; justify-content: space-between; align-items: center; padding: 24px 32px; border-bottom: 1px solid var(--border); }
        .list-header-title { font-size: 1.4rem; font-weight: 800; }
        .list-count { background: var(--brand-primary); color: var(--white); padding: 4px 14px; border-radius: 8px; font-size: 0.9rem; font-weight: 700; }

        /* Custom Search Bar */
        .search-wrap { padding: 16px 32px; background: var(--bg); border-bottom: 1px solid var(--border); }
        .search-wrap input { width: 100%; padding: 14px 16px 14px 44px; border: 1.5px solid var(--border-strong); border-radius: 10px; font-size: 1rem; font-family: inherit; outline: none; transition: border-color 0.2s, box-shadow 0.2s; background: var(--white) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="%2364748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>') no-repeat 14px center; }
        .search-wrap input:focus { border-color: var(--brand-primary); box-shadow: 0 0 0 4px var(--ring-brand-legacy-soft); }

        /* Larger Patient Rows */
        .patient-list { max-height: calc(100vh - 250px); overflow-y: auto; }
        .patient-list > .grid { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
        .patient-row { display: flex; align-items: center; padding: 20px 32px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background 0.15s; }
        .patient-row:hover { background: var(--bg); }
        .patient-row:last-child { border-bottom: none; }
        .patient-av { width: 52px; height: 52px; border-radius: 50%; background: var(--brand-primary); color: var(--white); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; font-weight: 800; margin-right: 20px; box-shadow: none; }
        .patient-info { flex: 1; }
        .patient-name { font-size: 1.1rem; font-weight: 700; color: var(--text); margin-bottom: 4px; }
        .patient-meta { font-size: 0.9rem; color: var(--text-secondary); font-weight: 500; }
        .patient-arrow { color: var(--border-strong); font-size: 1.4rem; font-weight: bold; transition: color 0.2s; }
        .patient-row:hover .patient-arrow { color: var(--brand-primary); }
        .empty-list { padding: 60px 20px; text-align: center; color: var(--text-secondary); font-size: 1.1rem; }

        /* Cellphone Compatibility */
        @media (max-width: 600px) {
            .list-header { padding: 20px; }
            .list-header-title { font-size: 1.2rem; }
            .search-wrap { padding: 14px 20px; }
            .patient-row { padding: 16px 20px; }
            .patient-row:hover { padding-left: 20px; }
            .patient-av { width: 44px; height: 44px; font-size: 1rem; margin-right: 14px; }
            .patient-name { font-size: 1rem; }
        }
    </style>
</head>
<body>

<div id="root"></div>

<script type="module" src="../src/app/patients/records.tsx"></script>
</body>
</html>
